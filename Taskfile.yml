version: '3'

vars:
  VENV_DIR: .venv

tasks:
  install:
    desc: Crea entorno virtual e instala dependencias
    cmds:
      - py -m venv {{.VENV_DIR}}
      - .venv/Scripts/python -m pip install -r requirements.txt

  run:
    desc: Ejecuta el pipeline principal (usa datos cacheados)
    dir: "{{.ROOT}}"
    cmds:
      - .venv/Scripts/python -m src.services.main_runner

  run-full:
    desc: Ejecuta el pipeline forzando descarga desde cero
    dir: "{{.ROOT}}"
    cmds:
      - .venv/Scripts/python -m src.services.main_runner --force-download

  api:
    desc: Inicia el servidor API REST
    dir: "{{.ROOT}}"
    cmds:
      - .venv/Scripts/python -m src.api.gateway

  test:
    desc: Ejecuta las pruebas unitarias
    dir: "{{.ROOT}}"
    cmds:
      - .venv/Scripts/pytest -v

  clean:
    desc: Limpia archivos generados y caches
    cmds:
      - if (Test-Path __pycache__) { Remove-Item -Recurse -Force __pycache__ }
      - if (Test-Path src/__pycache__) { Remove-Item -Recurse -Force src/__pycache__ }
      - Get-ChildItem -Path src -Recurse -Filter *.pyc | Remove-Item -Force
      - if (Test-Path tests/__pycache__) { Remove-Item -Recurse -Force tests/__pycache__ }
      - if (Test-Path .pytest_cache) { Remove-Item -Recurse -Force .pytest_cache }
      - if (Test-Path .ruff_cache) { Remove-Item -Recurse -Force .ruff_cache }
      - if (Test-Path outputs) { Remove-Item -Recurse -Force outputs\* }
      - Get-ChildItem -Path data/processed -Filter *.png | Remove-Item -Force
      - Get-ChildItem -Path data/processed -Filter *.csv | Remove-Item -Force

  clean-data:
    desc: Limpia solo datos procesados
    cmds:
      - Get-ChildItem -Path data/processed -Filter *.png | Remove-Item -Force
      - Get-ChildItem -Path data/processed -Filter *.csv | Remove-Item -Force

  build:
    desc: Construye imágenes Docker
    cmds:
      - docker-compose build

  up:
    desc: Inicia todos los servicios con Docker
    cmds:
      - docker-compose up

  down:
    desc: Detiene todos los servicios Docker
    cmds:
      - docker-compose down

  lint:
    desc: Ejecuta linter de código
    dir: "{{.ROOT}}"
    cmds:
      - .venv/Scripts/python -m ruff check src/ tests/

  help:
    desc: Muestra esta ayuda
    cmds:
      - task --list
